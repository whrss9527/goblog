<!DOCTYPE html>
<html lang="zh-CN">
<head>{{template "admin-head" .}}<title>登录 · 后台</title></head>
<body class="admin">
<main class="admin-auth">
    <div class="admin-auth-card">
        <h1>{{.site_name}}</h1>
        <p>登录后台</p>
        <form method="POST" action="/admin/sign-in">
            <div class="form-floating mb-3">
                <input class="form-control" id="inputEmail" type="email" name="email" placeholder="name@example.com" autocomplete="username" inputmode="email" required autofocus/>
                <label for="inputEmail">邮箱</label>
            </div>
            <div class="form-floating mb-4">
                <input class="form-control" id="inputPassword" type="password" name="password" placeholder="密码" autocomplete="current-password" required/>
                <label for="inputPassword">密码</label>
            </div>
            <button class="btn btn-primary" type="submit">登录</button>
        </form>
        <a class="admin-auth-back" href="/">← 回到博客</a>
    </div>
</main>
</body>
</html>
