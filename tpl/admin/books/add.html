<!DOCTYPE html>
<html lang="zh-CN">
<head>{{template "admin-head" .}}<title>{{if .book}}编辑书籍{{else}}添加书籍{{end}} · 后台</title></head>
{{template "admin-open" .}}
<div class="admin-page-head">
    <h1>{{if .book}}编辑书籍{{else}}添加书籍{{end}}</h1>
    <a class="btn btn-outline-secondary" href="/admin/books">返回列表</a>
</div>
<div class="card admin-form-card">
    <div class="card-body">
        <form class="admin-form" action="/admin/books/save" method="POST">
            <input type="hidden" name="_csrf" value="{{.csrf_token}}">
            <input type="hidden" name="id" value="{{if .book}}{{.book.Id}}{{end}}">
            <div class="mb-3">
                <label class="form-label" for="book-title">书名 *</label>
                <input class="form-control" id="book-title" type="text" name="title" value="{{if .book}}{{.book.Title}}{{end}}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="book-author">作者</label>
                <input class="form-control" id="book-author" type="text" name="author" value="{{if .book}}{{.book.Author}}{{end}}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="isbn">ISBN（填写后可自动获取封面）</label>
                <div class="input-group">
                    <input class="form-control" type="text" name="isbn" id="isbn" inputmode="numeric" value="{{if .book}}{{.book.ISBN}}{{end}}">
                    <button type="button" class="btn btn-outline-secondary" id="fetch-cover">获取封面</button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="cover">封面 URL（留空则自动按 ISBN 获取）</label>
                <input class="form-control" type="text" name="cover" id="cover" inputmode="url" value="{{if .book}}{{.book.Cover}}{{end}}">
                <img id="cover-preview" class="admin-cover-preview" alt="" {{if and .book .book.Cover}}src="{{.book.Cover}}"{{else}}hidden{{end}}>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-6 col-md-3">
                    <label class="form-label" for="book-status">状态</label>
                    <select class="form-select" id="book-status" name="status">
                        <option value="1" {{if .book}}{{if eq .book.Status 1}}selected{{end}}{{end}}>在读</option>
                        <option value="2" {{if .book}}{{if eq .book.Status 2}}selected{{end}}{{end}}>已读</option>
                        <option value="3" {{if .book}}{{if eq .book.Status 3}}selected{{end}}{{end}}>想读</option>
                        <option value="4" {{if .book}}{{if eq .book.Status 4}}selected{{end}}{{end}}>弃读</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="book-progress">进度（0–100）</label>
                    <input class="form-control" id="book-progress" type="number" name="progress" min="0" max="100" inputmode="numeric" value="{{if .book}}{{.book.Progress}}{{else}}0{{end}}">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="book-rating">评分（1–5，0 未评）</label>
                    <input class="form-control" id="book-rating" type="number" name="rating" min="0" max="5" inputmode="numeric" value="{{if .book}}{{.book.Rating}}{{else}}0{{end}}">
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="book-year">年份 *</label>
                    <input class="form-control" id="book-year" type="number" name="year" inputmode="numeric" value="{{if .book}}{{.book.Year}}{{else}}{{.this_year}}{{end}}" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="book-comment">短评</label>
                <textarea class="form-control" id="book-comment" name="comment" rows="3">{{if .book}}{{.book.Comment}}{{end}}</textarea>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label class="form-label" for="book-start">开始日期</label>
                    <input class="form-control" id="book-start" type="date" name="start_date" value="{{if .book}}{{.book.StartDate}}{{end}}">
                </div>
                <div class="col-6">
                    <label class="form-label" for="book-finish">完成日期</label>
                    <input class="form-control" id="book-finish" type="date" name="finish_date" value="{{if .book}}{{.book.FinishDate}}{{end}}">
                </div>
            </div>
            <div class="admin-form-actions">
                <button type="submit" class="btn btn-primary">保存</button>
                <a class="btn btn-link" href="/admin/books">取消</a>
            </div>
        </form>
    </div>
</div>
<script>
(function () {
    var cover = document.getElementById('cover');
    var preview = document.getElementById('cover-preview');
    function show(url) {
        if (url) { preview.src = url; preview.hidden = false; } else { preview.hidden = true; }
    }
    document.getElementById('fetch-cover').addEventListener('click', function () {
        var isbn = document.getElementById('isbn').value.replace(/[^0-9Xx]/g, '');
        if (!isbn) { document.getElementById('isbn').focus(); return; }
        cover.value = 'https://covers.openlibrary.org/b/isbn/' + isbn + '-M.jpg';
        show(cover.value);
    });
    cover.addEventListener('input', function () { show(cover.value.trim()); });
})();
</script>
{{template "admin-close" .}}
</html>
