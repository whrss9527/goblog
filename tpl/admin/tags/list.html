<!DOCTYPE html>
<html lang="zh-CN">
<head>{{template "admin-head" .}}<title>标签 · 后台</title></head>
{{template "admin-open" .}}
<div class="admin-page-head">
    <h1>标签 <small>{{len .tags}} 个</small></h1>
</div>
<p class="admin-hint">标签不用单独创建：写文章时在「标签」里填上名字（多个用逗号分隔），保存后会自动出现在这里。</p>
<div class="card">
    <div class="card-body">
        <table id="datatablesSimple" class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>标签</th>
                <th>文章数</th>
            </tr>
            </thead>
            <tbody>
            {{range .tags}}
            <tr>
                <td>{{.Id}}</td>
                <td><a class="admin-title" href="/?tag_id={{.Id}}" target="_blank" rel="noopener">{{.Name}}</a></td>
                <td>{{.Count}}</td>
            </tr>
            {{end}}
            </tbody>
        </table>
    </div>
</div>
{{template "admin-close" .}}
</html>
