{{define "heatmap"}}
<section class="section-card gh-heatmap" aria-label="发文热力图">
    <div class="gh-heatmap-header">
        <h2 id="heatmap-summary">发文热力图</h2>
        <select class="gh-heatmap-year-select" id="heatmap-year-select" aria-label="选择年份"></select>
    </div>
    <div class="gh-heatmap-scroll" id="heatmap-scroll">
        <div class="gh-heatmap-body">
            <div class="gh-heatmap-months" id="heatmap-months"></div>
            <div class="gh-heatmap-graph">
                <div class="gh-heatmap-weekdays" aria-hidden="true">
                    <span>&nbsp;</span><span>一</span><span>&nbsp;</span><span>三</span><span>&nbsp;</span><span>五</span><span>&nbsp;</span>
                </div>
                <div class="gh-heatmap-grid" id="heatmap-grid"></div>
            </div>
        </div>
    </div>
    <div class="gh-heatmap-legend" aria-hidden="true">
        少 <span class="gh-heatmap-level-0"></span><span class="gh-heatmap-level-1"></span><span class="gh-heatmap-level-2"></span><span class="gh-heatmap-level-3"></span><span class="gh-heatmap-level-4"></span> 多
    </div>
    <div class="gh-heatmap-detail" id="heatmap-detail" aria-live="polite"></div>
</section>
<div class="gh-heatmap-tooltip" id="heatmap-tooltip" role="tooltip"></div>

<script id="heatmap-data" type="application/json">{{.heatmap}}</script>
<script>
(function () {
    var rawData;
    try {
        rawData = JSON.parse(document.getElementById('heatmap-data').textContent);
    } catch (e) {
        rawData = [];
    }
    if (!Array.isArray(rawData)) { rawData = []; }

    var dataByDate = {};
    var yearSet = {};
    rawData.forEach(function (d) {
        dataByDate[d.date] = d;
        yearSet[d.date.substring(0, 4)] = true;
    });

    var select = document.getElementById('heatmap-year-select');
    var recentOpt = document.createElement('option');
    recentOpt.value = 'recent';
    recentOpt.textContent = '最近一年';
    select.appendChild(recentOpt);
    Object.keys(yearSet).sort().reverse().forEach(function (y) {
        var opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + ' 年';
        select.appendChild(opt);
    });
    select.value = 'recent';

    var monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    var tooltip = document.getElementById('heatmap-tooltip');
    var grid = document.getElementById('heatmap-grid');
    var monthsEl = document.getElementById('heatmap-months');
    var summaryEl = document.getElementById('heatmap-summary');
    var detailEl = document.getElementById('heatmap-detail');
    var scrollEl = document.getElementById('heatmap-scroll');
    var canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function level(count) {
        return count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : count <= 4 ? 3 : 4;
    }

    function placeTooltip(e) {
        var x = Math.min(e.clientX + 12, window.innerWidth - tooltip.offsetWidth - 8);
        tooltip.style.left = Math.max(8, x) + 'px';
        tooltip.style.top = Math.max(8, e.clientY - 34) + 'px';
    }

    function renderYear(mode) {
        grid.innerHTML = '';
        monthsEl.innerHTML = '';
        detailEl.style.display = 'none';

        var startDate, endDate;
        if (mode === 'recent') {
            endDate = new Date();
            endDate.setHours(0, 0, 0, 0);
            startDate = new Date(endDate);
            startDate.setFullYear(startDate.getFullYear() - 1);
            startDate.setDate(startDate.getDate() + 1);
        } else {
            var yr = parseInt(mode, 10);
            startDate = new Date(yr, 0, 1);
            endDate = new Date(yr, 11, 31);
        }

        var cursor = new Date(startDate);
        cursor.setDate(cursor.getDate() - cursor.getDay()); // align to Sunday

        var totalPosts = 0;
        var totalDays = 0;
        var lastMonth = -1;
        var colIndex = 0;
        var frag = document.createDocumentFragment();

        while (cursor <= endDate) {
            var colDiv = document.createElement('div');
            colDiv.className = 'gh-heatmap-col';
            var monthOfCol = -1;

            for (var i = 0; i < 7; i++) {
                var cell = document.createElement('div');
                cell.className = 'gh-heatmap-cell';
                if (cursor < startDate || cursor > endDate) {
                    cell.style.visibility = 'hidden';
                } else {
                    var ds = cursor.getFullYear() + '-' + pad(cursor.getMonth() + 1) + '-' + pad(cursor.getDate());
                    var entry = dataByDate[ds];
                    var count = entry ? entry.total : 0;
                    totalPosts += count;
                    if (count > 0) { totalDays++; }
                    if (monthOfCol < 0) { monthOfCol = cursor.getMonth(); }
                    cell.classList.add('gh-heatmap-level-' + level(count));
                    cell.setAttribute('data-date', ds);
                    cell.setAttribute('data-count', count);
                    if (count > 0) {
                        cell.setAttribute('role', 'button');
                        cell.setAttribute('tabindex', '0');
                        cell.setAttribute('aria-label', ds + ' 发布 ' + count + ' 篇文章');
                    }
                }
                colDiv.appendChild(cell);
                cursor.setDate(cursor.getDate() + 1);
            }

            if (monthOfCol >= 0 && monthOfCol !== lastMonth) {
                var label = document.createElement('span');
                label.setAttribute('data-col', colIndex);
                label.textContent = monthNames[monthOfCol];
                monthsEl.appendChild(label);
                lastMonth = monthOfCol;
            }
            frag.appendChild(colDiv);
            colIndex++;
        }
        grid.appendChild(frag);

        // Use slightly smaller cells when that makes the whole year fit without
        // scrolling (desktop); phones keep 13px cells and scroll sideways.
        var room = scrollEl.clientWidth - 26;
        var size = Math.floor(room / colIndex) - 3;
        size = size >= 10 ? Math.min(13, size) : 13;
        var step = size + 3;
        grid.parentNode.parentNode.style.setProperty('--cell', size + 'px');
        Array.prototype.forEach.call(monthsEl.children, function (label) {
            label.style.left = (parseInt(label.getAttribute('data-col'), 10) * step) + 'px';
        });
        monthsEl.style.width = (colIndex * step) + 'px';

        var rangeLabel = mode === 'recent' ? '过去一年' : mode + ' 年';
        summaryEl.textContent = rangeLabel + '发布 ' + totalPosts + ' 篇文章，活跃 ' + totalDays + ' 天';

        // Narrow screens: start at the most recent weeks instead of a year ago.
        if (mode === 'recent') { scrollEl.scrollLeft = scrollEl.scrollWidth; } else { scrollEl.scrollLeft = 0; }
    }

    function esc(s) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(s == null ? '' : String(s)));
        return d.innerHTML;
    }

    function showDetail(cell) {
        var date = cell.getAttribute('data-date');
        var entry = dataByDate[date];
        if (!entry || !entry.details) { return; }
        var prev = grid.querySelector('.is-selected');
        if (prev) { prev.classList.remove('is-selected'); }
        cell.classList.add('is-selected');

        var html = '<h3>' + esc(date) + ' 发布的文章</h3><ul>';
        entry.details.forEach(function (d) {
            var time = d.date ? d.date.substring(11, 16) : '';
            var words = d.value ? d.value + ' 字' : '';
            html += '<li><a href="' + esc(d.link) + '">' + esc(d.name) + '</a>';
            if (time) { html += '<span class="detail-time">' + esc(time) + '</span>'; }
            if (words) { html += '<span class="detail-words">' + esc(words) + '</span>'; }
            html += '</li>';
        });
        html += '</ul>';
        detailEl.innerHTML = html;
        detailEl.style.display = 'block';
        detailEl.scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }

    // One delegated listener set instead of three listeners per cell (370 cells).
    grid.addEventListener('click', function (e) {
        var cell = e.target.closest('.gh-heatmap-cell');
        if (cell && parseInt(cell.getAttribute('data-count'), 10) > 0) { showDetail(cell); }
    });
    grid.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') { return; }
        var cell = e.target.closest('.gh-heatmap-cell');
        if (cell && parseInt(cell.getAttribute('data-count'), 10) > 0) {
            e.preventDefault();
            showDetail(cell);
        }
    });
    if (canHover) {
        grid.addEventListener('mouseover', function (e) {
            var cell = e.target.closest('.gh-heatmap-cell');
            if (!cell || !cell.hasAttribute('data-date')) { return; }
            var c = parseInt(cell.getAttribute('data-count'), 10);
            tooltip.textContent = cell.getAttribute('data-date') + '：' + (c > 0 ? c + ' 篇文章' : '没有文章');
            tooltip.style.display = 'block';
            placeTooltip(e);
        });
        grid.addEventListener('mousemove', placeTooltip);
        grid.addEventListener('mouseleave', function () { tooltip.style.display = 'none'; });
    }

    select.addEventListener('change', function () { renderYear(this.value); });
    renderYear('recent');
})();
</script>
{{end}}
