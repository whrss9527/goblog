{{define "content"}}
<div class="container container-narrow">
    <header class="page-header">
        <h1>归档</h1>
        <p class="page-sub"><span>共 {{.total}} 篇文章</span><span>{{len .archives}} 个年头</span></p>
    </header>

    <nav class="chips chips-scroll" aria-label="按年份跳转">
        {{range .archives}}
        <a class="chip" href="#y{{.Year}}">{{.Year}} <small>{{len .Posts}}</small></a>
        {{end}}
    </nav>

    <div class="archive-list">
        {{range .archives}}
        <section class="archive-year" id="y{{.Year}}">
            <h2 class="archive-year-title">{{.Year}} <small>{{len .Posts}} 篇</small></h2>
            <ul class="archive-posts">
                {{range .Posts}}
                <li class="archive-post-item">
                    <time class="archive-post-date" datetime="{{.CreatedAt.Format "2006-01-02"}}">{{.CreatedAt.Format "01-02"}}</time>
                    <a class="archive-post-link" href="/posts/{{.Identity}}">{{.Title}}</a>
                </li>
                {{end}}
            </ul>
        </section>
        {{end}}
    </div>
</div>
{{end}}
