<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{.title}} | {{.name}}</title>
    <meta name="description" content="{{.description}}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="generator" content="goblog {{.version}}"/>
    <meta name="color-scheme" content="light dark"/>
    {{if .noindex}}<meta name="robots" content="noindex"/>{{end}}
    {{if .canonical}}<link rel="canonical" href="{{.canonical}}"/>{{end}}
    <link rel="alternate" type="application/atom+xml" title="{{.name}}" href="/feed.xml"/>
    <meta property="og:title" content="{{.title}}"/>
    <meta property="og:description" content="{{.description}}"/>
    <meta property="og:site_name" content="{{.name}}"/>
    {{if .canonical}}<meta property="og:url" content="{{.canonical}}"/>{{end}}
    <meta property="og:type" content="{{if .post}}article{{else}}website{{end}}"/>
    <meta name="twitter:card" content="summary"/>
    <script>
        /* Apply the theme before first paint (no light flash in dark mode).
           Saved choice wins; otherwise follow the OS preference. */
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    theme = saved;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (e) { /* storage blocked: stay light */ }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" type="text/css" media="screen" href="{{.cdn}}/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{{asset "/static/css/style.css"}}">
    {{block "head" .}}{{end}}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SXYGHHQ02D"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-SXYGHHQ02D');
    </script>
</head>

<body>
<div id="reading-progress"></div>
<header>
    <nav class="navbar navbar-default" id="navbar">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                        data-target="#header-navbar" aria-expanded="false" aria-label="展开导航">
                    <span class="sr-only">展开导航</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <div class="logo">
                    <a class="logo-avatar" href="/intro" title="关于作者"><img src="{{.cdn}}/logo.png" alt="" width="50" height="50"></a>
                    <a class="logo-name" href="/">{{.name}}</a>
                    <a class="logo-rss" href="/feed.xml" title="RSS 订阅" aria-label="RSS 订阅">{{template "icon-rss"}}</a>
                </div>
            </div>
            <div class="collapse navbar-collapse" id="header-navbar">
                <form class="navbar-form nav navbar-form navbar-right search-nav" action="/" method="GET" role="search">
                    <div class="input-group">
                        <input type="search" name="keyword" class="form-control" placeholder="请输入关键字" maxlength="20"
                               autocomplete="off" aria-label="搜索文章" value="{{.keyword}}">
                        <span class="input-group-btn">
                                <button type="submit" class="btn btn-default btn-search">搜索</button>
                            </span>
                    </div>
                </form>
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="/">首页</a></li>
                    <li><a href="/archive">归档</a></li>
                    <li><a href="/tags">标签</a></li>
                    <li><a href="/reading">阅读</a></li>
                    <li><a href="/pages/about">关于</a></li>
                    <li>
                        <span id="dark-toggle" class="theme-switch" role="button" tabindex="0" aria-label="切换明暗主题">
                            <span class="theme-switch-knob">
                                <span class="theme-switch-sun">☀️</span>
                                <span class="theme-switch-moon">🌙</span>
                            </span>
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main id="main">
{{template "content" .}}
</main>

<div class="footer">
    <div class="container">
        <p>whrss.com © 2022–{{.year}} | Powered by <a href="https://github.com/whrss9527">whrss</a> | Based on <a
                href="https://getbootstrap.com/">Bootstrap</a></p>
    </div>
</div>

<script src="{{.cdn}}/js/jquery.min.js"></script>
<script src="{{.cdn}}/js/bootstrap.min.js"></script>
<script src="{{asset "/static/js/enhance.js"}}"></script>
{{block "scripts" .}}{{end}}

</body>

</html>
