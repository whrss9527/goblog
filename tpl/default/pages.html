{{define "head"}}{{template "markdown-head" .}}{{end}}

{{define "content"}}
<div class="container article-layout">
    <div class="article-main">
        <header class="article-header">
            <h1 class="article-title">{{.page.Title}}</h1>
        </header>

        <article class="article-content">
            <div id="page-viewer" data-allow-script="1">
                <textarea id="append-test" style="display:none;">{{.page.Content}}</textarea>
            </div>
            <noscript><p class="noscript-tip">本页需要启用 JavaScript 才能渲染正文。</p></noscript>
        </article>
        {{template "comments" .}}
    </div>
</div>
{{end}}

{{define "scripts"}}{{template "markdown-scripts" .}}{{end}}
